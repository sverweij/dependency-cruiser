name: "ensure the PR title is a semantic commit message"
on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
